<script type="text/worker">
const ALLOWED_ORIGIN="*";
function corsHeaders(){return{"Access-Control-Allow-Origin":ALLOWED_ORIGIN,"Access-Control-Allow-Methods":"GET, OPTIONS","Access-Control-Allow-Headers":"*"};}
function rewriteM3U8(content,baseUrl,proxyBase){const base=new URL(baseUrl);return content.split("\n").map(line=>{line=line.trim();if(!line||line.startsWith("#"))return line;try{const absolute=new URL(line,base).toString();return`${proxyBase}/proxy?url=${encodeURIComponent(absolute)}`;}catch{return line;}}).join("\n");}
export default{async fetch(request){const url=new URL(request.url);if(request.method==="OPTIONS")return new Response(null,{headers:corsHeaders()});if(url.pathname.startsWith("/karwan/")){const slug=url.pathname.split("/")[2]||"barin-movies";const directUrl=`https://cdn.karwan.tv/${slug}/tracks-v1a1/mono.m3u8`;const res=await fetch(directUrl,{headers:{"Referer":"https://karwan.tv/","Origin":"https://karwan.tv"}});if(!res.ok)return new Response("CDN fel "+res.status,{status:500,headers:corsHeaders()});let text=await res.text();text=rewriteM3U8(text,directUrl,`${url.origin}`);return new Response(text,{headers:{...corsHeaders(),"Content-Type":"application/vnd.apple.mpegurl","Cache-Control":"no-cache"}});}if(url.pathname==="/proxy"){const target=url.searchParams.get("url");if(!target)return new Response("Missing url",{status:400});const res=await fetch(target,{headers:{"Referer":"https://karwan.tv/","Origin":"https://karwan.tv"}});let body=await res.text();const ct=res.headers.get("content-type")||"";if(target.includes(".m3u8")||ct.includes("mpegurl")||body.includes("#EXTM3U")){body=rewriteM3U8(body,target,`${url.origin}`);return new Response(body,{headers:{...corsHeaders(),"Content-Type":"application/vnd.apple.mpegurl"}});}return new Response(res.body,{headers:{...corsHeaders(),"Content-Type":ct}});}return new Response("Använd /karwan/barin-movies",{headers:corsHeaders()});}}
</script>
