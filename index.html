<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quran · Böner & Skydd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/kurdistan24/k24-fonts@main/K24KurdishRegular-Regular.ttf" rel="preload" as="font" type="font/ttf" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/kurdistan24/k24-fonts@main/K24KurdishBold-Bold.ttf" rel="preload" as="font" type="font/ttf" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Amiri+Quran&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @font-face {
      font-family: 'K24 Kurdish';
      src: url('https://cdn.jsdelivr.net/gh/kurdistan24/k24-fonts@main/K24KurdishRegular-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'K24 Kurdish';
      src: url('https://cdn.jsdelivr.net/gh/kurdistan24/k24-fonts@main/K24KurdishBold-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    :root {
      --bg:#EFEAF9; --surface:#fff; --surface2:#F7F5FC; --border:#E4DEFC;
      --primary:#6C47E8; --primary-soft:#EDE8FC; --primary-glow:rgba(108,71,232,0.18);
      --emerald:#22C08A; --emerald-soft:#DCFDF2;
      --rose:#F05E7A; --rose-soft:#FDEDF0;
      --amber:#F59E0B; --amber-soft:#FEF3C7;
      --text:#1E1535; --text2:#7168A0; --text3:#A89FCE;
      --r:20px; --rsm:14px;
      --shadow:0 4px 24px rgba(108,71,232,0.10);
      --shadow-sm:0 2px 10px rgba(108,71,232,0.07);
      --font:'Times New Roman',Times,serif;
      --latin-font:'Inter','Roboto','Open Sans','Segoe UI',Arial,sans-serif;
      --quran-font:'Amiri Quran','Scheherazade New','Amiri','Traditional Arabic','Noto Naskh Arabic',serif;
      --kurdish-font:'K24 Kurdish','Vazirmatn','Noto Naskh Arabic','Amiri','Tahoma',sans-serif;
      --tafsir-font-size:19px;
      --section-bg-1:#FBF8FF;
      --section-bg-2:#F3F0FB;
      --translation-bg:#E8F9F1;
      --translation-border:#22C08A;
      --bottom-bar-height: 78px;
      --arabic-grad-1:#0E9C74;
      --arabic-grad-2:#0B7F92;
      --arabic-glow:rgba(14,156,116,0.30);
    }
    body.night {
      --bg:#1A1733; --surface:#2C2761; --surface2:#373072; --border:#4B4392;
      --primary-soft:#3E3680; --emerald-soft:#123B2C; --rose-soft:#3D1826; --amber-soft:#3C2C00;
      --text:#F4F1FC; --text2:#BDB6E0; --text3:#8A82BE;
      --shadow:0 4px 24px rgba(0,0,0,0.22);
      --section-bg-1:#2A2560;
      --section-bg-2:#332C6E;
      --translation-bg:#0F2A22;
      --arabic-grad-1:#0B6E52;
      --arabic-grad-2:#08596A;
      --arabic-glow:rgba(11,110,82,0.40);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html, body{width:100%;min-height:100vh}
    body{
      font-family:var(--latin-font);
      background:var(--bg);
      color:var(--text);
      transition:background .3s,color .3s;
      padding:24px 20px calc(var(--bottom-bar-height) + 30px);
      line-height:1.6;
      background-image:
        radial-gradient(circle at 0% 0%, rgba(108,71,232,.08) 0%, transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(34,192,138,.07) 0%, transparent 45%);
      background-attachment:fixed;
    }
    body.night{
      background-image:
        radial-gradient(circle at 0% 0%, rgba(108,71,232,.20) 0%, transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(34,192,138,.12) 0%, transparent 45%);
    }
    .container{
      max-width:1400px;
      width:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
    }

    .hdr{
      background:var(--surface);
      border-radius:var(--r);
      padding:22px 26px;
      margin-bottom:24px;
      box-shadow:var(--shadow-sm);
      border:1.5px solid var(--border);
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:16px;
    }
    .hdr-left{display:flex;align-items:center;gap:16px;min-width:0}
    .hdr-right{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
    .hdr-bismillah{
      font-family:var(--quran-font);
      font-size:34px;font-weight:700;color:var(--primary);
      text-align:center;line-height:1.3;padding:0 20px;
      letter-spacing:.02em;white-space:nowrap;
      text-shadow:0 1px 3px var(--primary-glow);
      transition:all .3s;
    }
    .hdr-bismillah:hover{color:#9B59E8;text-shadow:0 2px 8px var(--primary-glow)}
    body.night .hdr-bismillah{color:#C9B8FF;text-shadow:0 1px 4px rgba(201,184,255,.3)}

    .hdr-logo{
      width:56px;height:56px;border-radius:18px;
      background:linear-gradient(135deg,var(--primary),#9B59E8);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:26px;flex-shrink:0;
      box-shadow:0 4px 14px var(--primary-glow);
    }
    .hdr-info{flex:1;min-width:0}
    .hdr-title{font-size:22px;font-weight:900;color:var(--text);line-height:1.2}
    .hdr-sub{font-size:14px;color:var(--text3);font-weight:600;margin-top:2px;font-family:var(--kurdish-font)}
    .icon-btn{
      width:48px;height:48px;border-radius:15px;
      border:1.5px solid var(--border);background:var(--surface2);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--text2);font-size:18px;transition:all .2s;position:relative;
    }
    .icon-btn:active{background:var(--primary-soft);color:var(--primary);transform:scale(.92)}
    .icon-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .bdg{
      position:absolute;top:-4px;right:-4px;
      min-width:18px;height:18px;border-radius:50%;
      background:var(--rose);color:#fff;font-size:10px;font-weight:800;
      display:flex;align-items:center;justify-content:center;
      border:2px solid var(--surface);padding:0 3px;
    }
    .bdg.h{display:none}

    .daily-aya{
      background:linear-gradient(135deg,var(--primary),#9B59E8 60%,#7A3FE0);
      color:#fff;border-radius:var(--r);padding:28px 32px;
      margin-bottom:24px;box-shadow:0 12px 36px rgba(108,71,232,.35);
      position:relative;overflow:hidden;
    }
    .daily-aya::before{
      content:'';position:absolute;top:-60%;right:-25%;
      width:260px;height:260px;
      background:radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
      border-radius:50%;pointer-events:none;
    }
    .daily-aya::after{
      content:'';position:absolute;bottom:-40%;left:-20%;
      width:220px;height:220px;
      background:radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);
      border-radius:50%;pointer-events:none;
    }
    .daily-aya-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
      position:relative;z-index:1;
    }
    .daily-aya-label{
      font-size:12px;font-weight:800;text-transform:uppercase;
      letter-spacing:.14em;opacity:.9;
      display:flex;align-items:center;gap:8px;
      padding-top:6px;
    }
    .daily-aya-actions{
      display:flex;
      gap:8px;
      flex-shrink:0;
    }
    .day-action-btn{
      width:38px;height:38px;border-radius:50%;
      border:1.5px solid rgba(255,255,255,.5);
      background:rgba(255,255,255,.18);
      color:#fff;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;
      transition:all .2s;
      backdrop-filter:blur(4px);
    }
    .day-action-btn:hover{background:rgba(255,255,255,.32);transform:scale(1.05)}
    .day-action-btn:active{transform:scale(.9)}
    .day-action-btn.saved{
      background:#fff;
      color:var(--amber);
      border-color:#fff;
    }
    .day-action-btn.playing{
      background:#fff;
      color:var(--primary);
      border-color:#fff;
    }
    .day-action-btn.active{
      background:#fff;
      color:var(--emerald);
      border-color:#fff;
    }
    .daily-aya-qari-row{
      display:flex;align-items:center;gap:10px;
      margin-bottom:16px;position:relative;z-index:1;
      background:rgba(255,255,255,.16);
      border:1.5px solid rgba(255,255,255,.35);
      border-radius:12px;padding:8px 14px;
      backdrop-filter:blur(4px);
    }
    .daily-aya-qari-row i{color:#fff;font-size:14px;flex-shrink:0}
    .daily-aya-qari-row select{
      flex:1;height:38px;border:none;background:transparent;
      color:#fff;font-family:var(--latin-font);font-size:14px;font-weight:700;
      outline:none;cursor:pointer;
    }
    .daily-aya-qari-row select option{color:var(--text);background:var(--surface)}
    .daily-aya-ref{
      font-size:13px;font-weight:800;opacity:.95;
      background:rgba(255,255,255,.22);
      padding:5px 14px;border-radius:50px;
      display:inline-block;margin-bottom:16px;
      position:relative;z-index:1;letter-spacing:.02em;
    }
    .daily-aya-arabic{
      font-family:var(--quran-font);
      font-size:42px;line-height:2.4;direction:rtl;text-align:right;
      margin-bottom:20px;text-shadow:0 2px 4px rgba(0,0,0,.18);
      position:relative;z-index:1;word-break:break-word;
      font-feature-settings:"liga" 1, "calt" 1;
      -webkit-font-smoothing:antialiased;
    }
    .daily-aya-text{
      font-size:36px;line-height:1.8;
      border-top:1.5px solid rgba(255,255,255,.3);
      padding-top:16px;position:relative;z-index:1;
      font-style:italic;text-shadow:0 1px 2px rgba(0,0,0,.1);
    }
    .daily-aya-text.ku,
    .daily-aya-text.ku-KM,
    .daily-aya-text.fa{
      font-family:var(--kurdish-font);font-style:normal;
      font-size:38px;line-height:1.9;
    }
    .daily-aya-text.phonetic{
      font-family:'Times New Roman',Times,serif;
      font-style:italic;
      font-size:34px;
      line-height:1.75;
      direction:ltr;
      text-align:left;
      color:rgba(255,255,255,.97);
    }
    .daily-aya-loading{
      font-size:16px;opacity:.85;font-style:italic;
      padding:24px 0;text-align:center;
    }

    .section{
      background:linear-gradient(135deg, var(--section-bg-1) 0%, var(--section-bg-2) 100%);
      border-radius:var(--r);padding:26px 28px;
      margin-bottom:22px;box-shadow:var(--shadow-sm);
      border:1.5px solid var(--border);
      position:relative;overflow:hidden;
    }
    .section::before{
      content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--primary),var(--emerald),var(--amber));
      opacity:.65;
    }
    .section-title{
      font-size:19px;font-weight:900;color:var(--primary);
      margin-bottom:16px;display:flex;align-items:center;gap:10px;
      padding-bottom:14px;border-bottom:2px solid var(--border);
    }
    .section-title i{font-size:20px}
    .verse-block{position:relative;margin-bottom:16px}
    .verse-tools{
      display:flex;gap:6px;position:absolute;
      top:10px;left:10px;z-index:2;opacity:.9;
    }
    .verse-tool{
      width:38px;height:38px;border-radius:11px;
      border:1.5px solid rgba(255,255,255,.5);
      background:rgba(255,255,255,.18);color:#fff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;transition:all .2s;
      box-shadow:0 2px 6px rgba(0,0,0,.12);
      backdrop-filter:blur(4px);
    }
    .verse-tool:active{transform:scale(.9)}
    .verse-tool.copied{background:#fff;color:var(--emerald);border-color:#fff}
    .verse-tool.playing{background:#fff;color:var(--arabic-grad-1);border-color:#fff}
    .verse-tool:disabled{opacity:.35;cursor:not-allowed}
    .verse-tool:disabled:active{transform:none}
    .arabic{
      font-family:var(--quran-font);
      font-size:40px;line-height:2.5;direction:rtl;text-align:right;
      color:#fff;padding:20px 24px;
      background:linear-gradient(135deg,var(--arabic-grad-1),var(--arabic-grad-2));
      border-radius:var(--rsm);
      box-shadow:0 10px 28px var(--arabic-glow);
      word-break:break-word;position:relative;
      font-feature-settings:"liga" 1, "calt" 1;
      -webkit-font-smoothing:antialiased;
      text-shadow:0 2px 4px rgba(0,0,0,.18);
    }
    body.night .arabic{box-shadow:0 10px 28px var(--arabic-glow)}
    .arabic-small{font-size:34px;line-height:2.3;padding:18px 22px}
    .translation{
      font-size:34px;color:var(--text);
      padding:14px 20px;margin:12px 0 18px;
      border-left:4px solid var(--translation-border);
      background:var(--translation-bg);
      border-radius:0 12px 12px 0;
      min-height:26px;line-height:1.8;
      box-shadow:0 2px 8px rgba(34,192,138,.08);
    }
    .translation.ku,
    .translation.ku-KM,
    .translation.fa{
      font-family:var(--kurdish-font);font-size:36px;
      line-height:1.9;direction:rtl;text-align:right;
    }
    .translation.phonetic{
      font-family:'Times New Roman',Times,serif;font-style:italic;
      font-size:32px;line-height:1.8;direction:ltr;text-align:left;
      color:var(--text2);
    }
    body.night .translation{
      color:#D8F5E8;border-left-color:var(--emerald);
      box-shadow:0 2px 8px rgba(34,192,138,.18);
    }
    .divider{height:1px;background:var(--border);margin:22px 0;border:none}
    .pill{
      display:inline-block;font-size:13px;font-weight:800;
      padding:5px 14px;border-radius:50px;
      background:var(--primary-soft);color:var(--primary);
      margin-bottom:12px;
    }
    .footer{
      text-align:center;font-size:14px;color:var(--text3);
      padding:24px 0 12px;font-weight:600;
    }
    .footer span{font-family:var(--quran-font)}
    .sura-picker{display:flex;gap:10px;flex-wrap:wrap}
    .sura-picker select{
      flex:1;min-width:180px;height:52px;
      border-radius:var(--rsm);border:2px solid var(--border);
      background:var(--surface);padding:0 16px;
      font-family:var(--latin-font);font-size:16px;font-weight:700;
      color:var(--text);cursor:pointer;outline:none;
    }
    .sura-picker input{
      flex:0 0 110px;height:52px;
      border-radius:var(--rsm);border:2px solid var(--border);
      background:var(--surface);padding:0 16px;
      font-family:var(--latin-font);font-size:16px;font-weight:700;
      color:var(--text);outline:none;text-align:center;
    }
    .sura-picker button{
      flex:1;min-width:140px;height:52px;
      border-radius:var(--rsm);border:none;
      background:linear-gradient(135deg,var(--primary),#9B59E8);
      color:#fff;font-family:var(--latin-font);font-size:16px;font-weight:800;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
      box-shadow:0 4px 14px var(--primary-glow);
      transition:all .2s;
    }
    .sura-picker button:active{transform:scale(.97);opacity:.9}

    /* ElevenLabs-röstrad i sura-sektioner */
    .voice-row{
      display:flex;align-items:center;gap:10px;
      margin-bottom:14px;
      background:var(--surface2);
      border:1.5px solid var(--border);
      border-radius:12px;padding:8px 14px;
    }
    .voice-row i{color:var(--primary);font-size:14px;flex-shrink:0}
    .voice-row select{
      flex:1;height:38px;border:none;background:transparent;
      color:var(--text);font-family:var(--latin-font);font-size:14px;font-weight:700;
      outline:none;cursor:pointer;max-width:100%;
    }
    .voice-row select option{color:var(--text);background:var(--surface)}

    .fav-item{
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--rsm);padding:16px 18px;margin-bottom:12px;
      position:relative;
    }
    .fav-ref{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:8px}
    .fav-arabic{
      font-family:var(--quran-font);
      font-size:26px;line-height:2.2;direction:rtl;text-align:right;
      color:var(--text);margin-bottom:10px;word-break:break-word;
      font-feature-settings:"liga" 1, "calt" 1;
    }
    .fav-text{
      font-size:30px;color:var(--text);line-height:1.7;
      border-left:3px solid var(--emerald);
      background:var(--translation-bg);
      padding:10px 14px;border-radius:0 8px 8px 0;
    }
    .fav-text.ku,
    .fav-text.ku-KM,
    .fav-text.fa{
      font-family:var(--kurdish-font);font-size:32px;
      line-height:1.85;direction:rtl;text-align:right;
    }
    .fav-text.phonetic{
      font-family:'Times New Roman',Times,serif;font-style:italic;
      font-size:30px;line-height:1.7;direction:ltr;text-align:left;
    }
    .fav-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
    .fav-actions button{
      width:40px;height:40px;border-radius:11px;border:none;
      cursor:pointer;font-size:15px;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;
    }
    .fav-actions .fav-view{background:var(--primary-soft);color:var(--primary)}
    .fav-actions .fav-del{background:var(--rose-soft);color:var(--rose)}
    .fav-actions button:active{transform:scale(.92)}
    .fav-empty{text-align:center;padding:28px;color:var(--text3);font-weight:700}
    .fav-empty i{font-size:36px;margin-bottom:12px;display:block;opacity:.5}
    .modal-ov{
      position:fixed;inset:0;background:rgba(0,0,0,.5);
      backdrop-filter:blur(6px);z-index:200;
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .modal-ov.h{display:none}
    .modal-card{
      background:var(--surface);border-radius:var(--r);
      padding:28px;max-width:700px;width:100%;
      max-height:85vh;overflow-y:auto;
      border:1.5px solid var(--border);box-shadow:var(--shadow);
    }
    .modal-card .modal-ref{font-size:14px;font-weight:800;color:var(--primary);margin-bottom:12px}
    .modal-card .modal-arabic{
      font-family:var(--quran-font);
      font-size:34px;line-height:2.4;direction:rtl;text-align:right;
      color:#fff;padding:20px;
      background:linear-gradient(135deg,var(--arabic-grad-1),var(--arabic-grad-2));
      border-radius:var(--rsm);
      box-shadow:0 8px 22px var(--arabic-glow);
      margin-bottom:16px;word-break:break-word;
      font-feature-settings:"liga" 1, "calt" 1;
      text-shadow:0 2px 4px rgba(0,0,0,.18);
    }
    .modal-card .modal-text{
      font-size:34px;color:var(--text);line-height:1.75;
      border-left:4px solid var(--emerald);
      background:var(--translation-bg);
      padding:14px 16px;border-radius:0 10px 10px 0;
      margin-bottom:20px;
    }
    .modal-card .modal-text.ku,
    .modal-card .modal-text.ku-KM,
    .modal-card .modal-text.fa{
      font-family:var(--kurdish-font);font-size:36px;
      line-height:1.9;direction:rtl;text-align:right;
    }
    .modal-card .modal-text.phonetic{
      font-family:'Times New Roman',Times,serif;font-style:italic;
      font-size:32px;line-height:1.8;direction:ltr;text-align:left;
    }
    body.night .modal-card .modal-text{color:#D8F5E8}
    .modal-card .modal-close{
      width:100%;height:52px;border-radius:var(--rsm);
      border:none;background:var(--primary);color:#fff;
      font-family:var(--latin-font);font-size:16px;font-weight:800;
      cursor:pointer;transition:all .2s;
    }
    .modal-card .modal-close:active{opacity:.85;transform:scale(.98)}

    /* ===== TAFSIR ===== */
    .tafsir-card{
      max-width:800px;width:100%;padding:0;
      display:flex;flex-direction:column;
      max-height:90vh;overflow:hidden;
    }
    .tafsir-card.is-fullscreen{
      max-width:100% !important;
      width:100% !important;
      max-height:100vh !important;
      height:100vh !important;
      border-radius:0 !important;
      border:none !important;
    }
    #tafsirModal.is-fullscreen{ padding:0 !important; }
    .tafsir-topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:22px 24px 14px;flex-shrink:0;gap:8px;
    }
