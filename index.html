<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagens Aya — Koranläsning</title>
    <style>
        /* ===== Grundläggande styling ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            color: #fff;
        }

        /* ===== Statusfält (tid + väder) ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clock {
            /* Fix 3: Klockan visas nu alltid, även på mobil */
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
        }

        .weather {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size:  ​​13px;
        }

        .weather-icon {
            font-size: 16px;
        }

        /* ===== Huvudinnehåll ===== */
        .header {
            text-align: center;
            margin: 20px 0 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* ===== Surah-väljare ===== */
        .surah-selector {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .surah-selector span:first-child {
            font-size: 14px;
            opacity: 0.8;
        }

        .surah-selector span:last-child {
            font-size: 16px;
            font-weight: bold;
        }

        /* ===== Reciter-väljare ===== */
        .reciter-selector {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .reciter-selector span:first-child {
            font-size: 14px;
            opacity: 0.8;
        }

        .reciter-selector span:last-child {
            font-size: 16px;
            font-weight: bold;
        }

        /* ===== Spelarkontroller ===== */
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .control-btn.play {
            width: 65px;
            height: 65px;
            background: #fff;
            color: #6a11cb;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* ===== Språkväljare ===== */
        .language-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .lang-btn {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #fff;
            color: #6a11cb;
            font-weight: bold;
        }

        /* ===== Fix 1: Uttal-knappen (nedre högra) ===== */
        .pronunciation-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #fff;
            color: #6a11cb;
            border: none;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .pronunciation-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        /* ===== Fix 2: Notis (popup-meddelande) ===== */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333; /* Mörk bakgrund för kontrast */
            color: #fff; /* Vit text */
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 2000;
            display: none; /* Dold som standard */
            align-items: center;
            gap: 8px;
            animation: slideDown 0.3s ease;
        }

        .notification.show {
            display: flex;
        }

        .notification .star-icon {
            font-size: 18px;
            color: #ffd700; /* Guldstjärna */
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ===== Responsiv design för mobil ===== */
        @media (max-width: 480px) {
            .app-container {
                padding: 15px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }

            .control-btn.play {
                width: 55px;
                height: 55px;
                font-size: 22px;
            }

            /* Fix 3: Säkerställ att klockan visas på mobil */
            .clock {
                display: inline-block !important;
                font-size: 13px;
            }

            .weather {
                font-size: 12px;
            }

            /* Fix 1: Justera knappens position på mycket små skärmar */
            .pronunciation-btn {
                bottom: 15px;
                right: 15px;
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }

        /* Extra säkerhet för Fix 3: Se till att inget döljer klockan */
        .status-bar .clock,
        .status-bar .weather {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Statusfält med tid och väder -->
        <div class="status-bar">
            <div class="status-left">
                <span class="clock" id="clock">10:48</span>
                <span class="weather">
                    <span class="weather-icon">🌤️</span>
                    <span>18°</span>
                </span>
            </div>
            <div class="status-right">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- Rubrik -->
        <div class="header">
            <h1>DAGENS AYA</h1>
            <p>Ahmed Al-Ajamy</p>
        </div>

        <!-- Surah-väljare -->
        <div class="surah-selector" onclick="showNotification('Al-Baqarah har valts!')">
            <span>Surah</span>
            <span>2. Al-Baqarah (286 verser) ▼</span>
        </div>

        <!-- Reciter-väljare -->
        <div class="reciter-selector" onclick="showNotification('Reciter: Ahmed Al-Ajamy')">
            <span>Reciter</span>
            <span>Ahmed Al-Ajamy ▼</span>
        </div>

        <!-- Spelarkontroller -->
        <div class="player-controls">
            <button class="control-btn" onclick="showNotification('Spola tillbaka')">⏮</button>
            <button class="control-btn play" onclick="showNotification('Spelar...')">▶</button>
            <button class="control-btn" onclick="showNotification('Spola framåt')">⏭</button>
        </div>

        <!-- Språkväljare -->
        <div class="language-selector">
            <button class="lang-btn" onclick="showNotification('Svenska valt')">Svenska</button>
            <button class="lang-btn" onclick="showNotification('English valt')">English</button>
            <button class="lang-btn active" onclick="showNotification('فارسی valt')">فارسی</button>
            <button class="lang-btn" onclick="showNotification('کوردی valt')">کوردی</button>
            <button class="lang-btn" onclick="showNotification('Kurdî valt')">Kurdî</button>
        </div>
    </div>

    <!-- Fix 1: Uttal-knappen — placerad med position:fixed så den alltid är inom skärmen -->
    <button class="pronunciation-btn" onclick="showNotification('Uttal aktiverat')">🔊</button>

    <!-- Fix 2: Notis-popup med mörk bakgrund för läsbarhet -->
    <div class="notification" id="notification">
        <span class="star-icon">⭐</span>
        <span id="notification-text">Meddelande</span>
    </div>

    <script>
        // Fix 3: Dynamisk klocka som alltid visas
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }

        // Uppdatera klockan direkt och varje minut
        updateClock();
        setInterval(updateClock, 60000);

        // Fix 2: Funktion för att visa notis med mörk bakgrund
        function showNotification(message) {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            text.textContent = message;
            notification.classList.add('show');

            // Dölj efter 2,5 sekunder
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2500);
        }
    </script>

</body>
</html>
