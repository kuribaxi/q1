  <style>
/*--------------------------------------------------------------
  NÅR TEXT‑MODE‑COLOR‑SLICKAN *ÄR* TILLGÄNGLIG?  
  HÄR SPÄTTS DEN GLOBALA BACKGRUNDSFÄRGEN (i de verkliga
  sidskärmarna) via ett nytt CSS‑variabl et “--tm‑bg”.
--------------------------------------------------------------*/

:root{
  /* Viktor för bakgrund när Text‑Mode aktiveras.  
     Ändras av setTextModeBg()   */
  --tm-bg:#000000;
}

/* Vanlig bakgrund (lägg till blint) */
html,
body{
  background:var(--bg,var(--bg-override));
  color:var(--text);
}

/* Bakgrund som vi tvättar före Text‑Mode‑skimmer blir aktiva. */
body.bg-override{
  background:var(--tm-bg);
  color:var(--text);
  border-color:var(--tm-bg);
}

/* Skins som har fast bakgrund (t.ex. sections, footer) */
.section-bg-1,
.section-bg-2,
.bottom-lang-inner,
.footer,
.navbar,
.sidebar,
.content-wrapper{
  background:var(--tm-bg) !important;
}

/* Text‑Mode‑layout‑knapparna & scroll‑scrollbar som får samma
   bakgrund */
#textModeOverlay[data-active],
#textModeOverlay.active,
#textModeOverlay::-webkit-scrollbar,
#textModeOverlay::-webkit-scrollbar::-webkit-scrollbar-thumb,
#textModeOverlay .tm-size-bar,
#textModeOverlay .tm-close,
.tm-sider,
.tm-sider ::before,
.tm-sider ::after{
  background:var(--tm-bg);
}

/*再生*/
.tm-size-bar,
.tm-close{
  background:var(--tm-bg);
}

/*---------- REST AV ORIGINAL CSS (BARA TILL AT BLIKTERA DEN HÄR -----------*/
... (den gamla css‑delen som du har.  BLIKTER radera oder addera endast de
sekter som börjar med `.section-bg-1` m.m. I denna version har
den nya bakgrundspärmarna ersatt de eviga färgerna. 
...
  … (den ändrade css‑delen ändras/linjestjärparte som visas ovan. 
   det paketet har bytt ut TEXT‑MODE‑COLOR‑SFÄRGEN till DEN GLOBALA
   INGENGRU HÄR. 
</style>

<script>
const APP_REFETCH_PROMISE = new Promise(resolve => {
  document.addEventListener('DOMContentLoaded',()=>resolve());
});
APP_REFETCH_PROMISE.then(()=>{

/*-------------------------------
    1️⃣ VARIABLES & GLOBALA FUNktioner
  -------------------------------*/
let textModeOn = false;
let textModeBg = '#000000';                 // bakgrundsfärgen du väljer

/*-------------------------------
    2️⃣ SETTEXTMODEBG (SPARAR & SKICKAR)
  -------------------------------*/
function setTextModeBg(color){
    textModeBg = color;
    try{ localStorage.setItem('quranTextModeBg',color); }catch(e){}
    toast(
        textModeBg === '#000000' ? 'Bakgrund inom Text‑Mode skuld.".
    );
}

/*-------------------------------
    3️⃣ EVENT‑LISTENAR för färg‑väljare
  -------------------------------*/
document.getElementById('tmColorInput').addEventListener('input',e=>setTextModeBg(e.target.value));
document.getElementById('tmBgColor').addEventListener('input',e=>setTextModeBg(e.target.value));

/*-------------------------------
    4️⃣ TOGGLE / TEXT‑MODE‑FUNKTIONEN
  -------------------------------*/
function toggleTextMode(){
  textModeOn = !textModeOn;
  const overlay = document.getElementById('textModeOverlay');
  const tmbBtn = document.getElementById('textModeBtn');

  // kjänn knap‑kedjorna
  if(overlay) overlay.classList.toggle('active',textModeOn);
  if(tmbBtn)   tmbBtn.classList.toggle('active',textModeOn);

  // jätta ihop denna bakgrund‑ändring med en CSS‑klass för specifika element
  // (så att du kan byta en bakgrund färgen även där du har hårda kvartersuk).
  if(textModeOn){
    const body = document.body;
    const doc  = document.documentElement;
    body.classList.add('bg-override');         // borde 👉 background: var(--tm-bg)    
    doc.style.removeProperty('--bg');
    doc.style.setProperty('--bg', textModeBg);
  }else{
    const body = document.body;
    body.classList.remove('bg-override');
    const doc  = document.documentElement;
    doc.style.removeProperty('--bg');           // usar default‑bakgrund i CSS
  }

  //----------------------------------------------------
  // REST AV DEN GÖRANTEliga LOGIKEN (wakelocks, timers, toast etc.)
  //----------------------------------------------------
  // (Du kan behålla den gamla funktionen som du har för wakelocks,
  //  ONLY STRIPPEN AV DEN URGENTE toggle‑logiken – den har
  //  fått sin färgbrytning tillbaka med CSS‑väljaren nedan.)

  /*-------------------*/
  // /*** TEXT‑MODE OVERLAY – tids‑rader *//**
  /*-------------------*/
  toggleTmWidget();
}

/*** Tala om att du fortfarande har befintlig logik för wakelocks, toast,
    cycle‑clock, etc.**// Kod du redan har!  SÄLJ RÄYES FÖRSTA SÄT
// som du har i din gamla script‑fil.  Jag har bara bytt ut
// de delar som berör bakgrundsfärg.  */

end of script-section

// ------------------------------------------------------------

/*------------------------------
 * ANDRA AVDELAR – MAKTIGEN (välj inkallt)
------------------------------*/

</script>
</body>
