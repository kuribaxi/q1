<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇸🇪 Körkortsteori – Övningsquiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b2b4b 0%, #1b4f7a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-container {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 28px 32px 38px;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      border-bottom: 2px solid #ffd966;
      padding-bottom: 15px;
    }

    h1 span {
      background: #ffd966;
      color: #0b2b4b;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 40px;
      margin-left: auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0f0ff;
      margin-bottom: 28px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 22px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stats-bar div {
      display: flex;
      gap: 28px;
    }

    .stats-bar span {
      background: #ffd966;
      color: #0b2b4b;
      padding: 4px 14px;
      border-radius: 50px;
      font-weight: 700;
      margin-left: 8px;
    }

    .progress-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 10px 0 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd966, #ffe89c);
      border-radius: 10px;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px #ffd966;
    }

    .question-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 28px 30px;
      margin-bottom: 28px;
      box-shadow: 0 18px 30px -10px rgba(0, 0, 0, 0.4);
      border-left: 10px solid #ffd966;
      transition: 0.2s;
    }

    .question-text {
      font-size: 1.6rem;
      font-weight: 600;
      color: #0b2b4b;
      line-height: 1.4;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }

    .question-number {
      background: #0b2b4b;
      color: #ffd966;
      width: 40px;
      height: 40px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .option {
      background: #f0f5fa;
      border-radius: 20px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.2rem;
      font-weight: 500;
      color: #113a5e;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      user-select: none;
    }

    .option:hover:not(.disabled) {
      background: #e3edf7;
      border-color: #b0c8e0;
      transform: scale(1.01);
    }

    .option.selected {
      background: #d4e6ff;
      border: 2px solid #1b4f7a;
      box-shadow: 0 8px 16px -6px #1b4f7a40;
    }

    .option.correct {
      background: #d4f0d4;
      border: 2px solid #1e7a3c;
      color: #0a3d1e;
    }

    .option.wrong {
      background: #ffe0e0;
      border: 2px solid #c0392b;
      color: #7a1f1f;
    }

    .option.disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .option-letter {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.3rem;
      color: #1b4f7a;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
    }

    .option.selected .option-letter {
      background: #1b4f7a;
      color: white;
    }

    .option.correct .option-letter {
      background: #1e7a3c;
      color: white;
    }

    .option.wrong .option-letter {
      background: #c0392b;
      color: white;
    }

    .feedback {
      margin-top: 24px;
      padding: 16px 22px;
      border-radius: 24px;
      font-size: 1.1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8f9fc;
      color: #0b2b4b;
      border-left: 6px solid #ffd966;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      margin-top: 22px;
    }

    button {
      background: #ffd966;
      border: none;
      padding: 18px 32px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0b2b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 12px 22px -8px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      flex: 1 1 auto;
      letter-spacing: 0.3px;
    }

    button:hover:not(:disabled) {
      background: #ffe28c;
      transform: scale(1.02);
      box-shadow: 0 18px 28px -8px #00000060;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 18px -8px #00000080;
    }

    .secondary-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.35);
      color: white;
    }

    .result-screen {
      background: #ffffff;
      border-radius: 32px;
      padding: 34px 32px;
      text-align: center;
      box-shadow: 0 20px 35px -10px black;
      animation: fadeIn 0.4s ease;
    }

    .result-screen h2 {
      font-size: 2.4rem;
      color: #0b2b4b;
      margin-bottom: 16px;
    }

    .score-big {
      font-size: 5rem;
      font-weight: 800;
      color: #1b4f7a;
      line-height: 1;
      margin: 20px 0 12px;
      text-shadow: 0 4px 0 #ffd966;
    }

    .result-screen p {
      font-size: 1.4rem;
      color: #2c3e50;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .hidden {
      display: none !important;
    }

    .badge {
      display: inline-block;
      background: #ffd966;
      padding: 6px 22px;
      border-radius: 40px;
      font-weight: 700;
      color: #0b2b4b;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .quiz-container { padding: 20px 16px; }
      h1 { font-size: 1.6rem; }
      .question-text { font-size: 1.3rem; }
      .option { font-size: 1rem; padding: 14px 16px; }
      button { padding: 14px 18px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="quiz-container">
  <h1>
    🚗 Körkortsteori
    <span>Sverige</span>
  </h1>

  <!-- Quiz del -->
  <div id="quizSection">
    <div class="stats-bar">
      <div>
        <span>Fråga <span id="currentQuestionNum">1</span>/<span id="totalQuestions">10</span></span>
      </div>
      <div>
        <span>Poäng: <span id="scoreDisplay">0</span></span>
      </div>
    </div>
    <div class="progress-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-card">
      <div class="question-text">
        <div class="question-number" id="qNumber">1</div>
        <div id="questionText">Laddar fråga...</div>
      </div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback hidden" id="feedbackMessage"></div>
    </div>

    <div class="button-row">
      <button id="nextBtn" disabled>Nästa fråga →</button>
      <button id="resetBtn" class="secondary-btn">🔄 Börja om</button>
    </div>
  </div>

  <!-- Resultat del -->
  <div id="resultSection" class="hidden result-screen">
    <div class="badge">🏁 Slutresultat</div>
    <h2>Ditt resultat</h2>
    <div class="score-big" id="finalScore">0/0</div>
    <p id="resultMessage">Bra kämpat!</p>
    <button id="restartFromResult">🔄 Öva igen</button>
  </div>
</div>

<script>
  // ---------- FRÅGEBANK (svensk körkortsteori) ----------
  const questions = [
    {
      question: "Vad är den högsta tillåtna hastigheten på en väg med denna skylt? (Vit botten, röd ring, svart siffra 50)",
      options: ["50 km/h", "60 km/h", "70 km/h", "40 km/h"],
      correct: 0,
      explanation: "Skylten anger högsta tillåtna hastighet. Siffran 50 betyder 50 km/h."
    },
    {
      question: "När får du köra om på höger sida?",
      options: [
        "Aldrig, det är alltid förbjudet",
        "När trafiken är tät och körfälten rör sig olika fort",
        "Endast på motorväg",
        "När du kör en långsam bil"
      ],
      correct: 1,
      explanation: "Vid tät köbildning får du köra om till höger om fordonen i det vänstra körfältet rör sig långsammare."
    },
    {
      question: "Vad betyder en gul blinkande trafiksignal?",
      options: [
        "Stanna omedelbart",
        "Kör försiktigt, signalen är ur funktion",
        "Förbud mot att köra",
        "Sväng vänster"
      ],
      correct: 1,
      explanation: "Gult blinkande ljus betyder att du ska vara extra uppmärksam och köra försiktigt, ofta vid signalur funktion."
    },
    {
      question: "Hur länge är ett körkort normalt giltigt i Sverige?",
      options: ["5 år", "10 år", "15 år", "Livstid"],
      correct: 1,
      explanation: "Ett svenskt körkort är giltigt i 10 år, sedan måste det förnyas (med undantag för vissa åldrar)."
    },
    {
      question: "Vad är minimimönsterdjupet i däcken på sommaren?",
      options: ["1,6 mm", "2,0 mm", "3,0 mm", "1,0 mm"],
      correct: 0,
      explanation: "Lagligt minimimönsterdjup är 1,6 mm för sommardäck vid färd på väg."
    },
    {
      question: "Vem har väjningsplikt i en korsning utan skyltar?",
      options: [
        "Den som kommer från vänster",
        "Den som kommer från höger",
        "Den som kör rakt fram",
        "Alla har väjningsplikt"
      ],
      correct: 1,
      explanation: "Högerregeln gäller: fordon som kommer från höger har företräde om inget annat anges."
    },
    {
      question: "Vad gäller för vinterdäck vid vinterväglag?",
      options: [
        "Vinterdäck är frivilligt",
        "Vinterdäck krävs alltid 1 dec – 31 mars",
        "Vinterdäck krävs vid vinterväglag 1 dec – 31 mars",
        "Sommardäck är tillåtna om det inte är snö"
      ],
      correct: 2,
      explanation: "Vid vinterväglag mellan 1 december och 31 mars måste fordonet ha vinterdäck (om inte annat anges)."
    },
    {
      question: "Vad innebär det att 'köra på rött' vid en trafiksignal?",
      options: [
        "Du får köra om du stannar först",
        "Det är alltid förbjudet och straffbart",
        "Du får köra om det är fritt",
        "Du får köra efter 3 sekunder"
      ],
      correct: 1,
      explanation: "Rött ljus betyder stopp. Att köra mot rött är en trafikförseelse."
    },
    {
      question: "Vilken nykterhetsgräns gäller för rattfylleri i Sverige?",
      options: ["0,2 promille", "0,5 promille", "0,8 promille", "0,0 promille"],
      correct: 0,
      explanation: "Gränsen för rattfylleri är 0,2 promille i blodet. 0,0 är att rekommendera."
    },
    {
      question: "Vad betyder en triangelformad skylt med röd kant?",
      options: [
        "Varningsskylt",
        "Förbudsskylt",
        "Påbudsskylt",
        "Informationsskylt"
      ],
      correct: 0,
      explanation: "Triangel med röd kant är en varningsskylt som varnar för fara eller annat förhållande."
    }
  ];

  // ---------- VARIABLER ----------
  let currentIndex = 0;
  let score = 0;
  let answered = false;
  let selectedOptionIndex = null;
  const totalQuestions = questions.length;

  // DOM-element
  const quizSection = document.getElementById('quizSection');
  const resultSection = document.getElementById('resultSection');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const qNumber = document.getElementById('qNumber');
  const currentQuestionNum = document.getElementById('currentQuestionNum');
  const totalQuestionsSpan = document.getElementById('totalQuestions');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const progressFill = document.getElementById('progressFill');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtn = document.getElementById('resetBtn');
  const feedbackMessage = document.getElementById('feedbackMessage');
  const finalScore = document.getElementById('finalScore');
  const resultMessage = document.getElementById('resultMessage');
  const restartFromResult = document.getElementById('restartFromResult');

  // ---------- HJÄLPFUNKTIONER ----------
  function updateStats() {
    currentQuestionNum.textContent = currentIndex + 1;
    totalQuestionsSpan.textContent = totalQuestions;
    scoreDisplay.textContent = score;
    const progressPercent = ((currentIndex) / totalQuestions) * 100;
    progressFill.style.width = progressPercent + '%';
  }

  function renderQuestion() {
    answered = false;
    selectedOptionIndex = null;
    nextBtn.disabled = true;
    feedbackMessage.classList.add('hidden');
    feedbackMessage.innerHTML = '';

    const q = questions[currentIndex];
    questionText.textContent = q.question;
    qNumber.textContent = currentIndex + 1;

    // Rensa options och bygg nya
    optionsContainer.innerHTML = '';
    q.options.forEach((optionText, idx) => {
      const optionDiv = document.createElement('div');
      optionDiv.classList.add('option');
      optionDiv.dataset.index = idx;

      const letterDiv = document.createElement('div');
      letterDiv.classList.add('option-letter');
      letterDiv.textContent = String.fromCharCode(65 + idx); // A, B, C, D

      const textSpan = document.createElement('span');
      textSpan.textContent = optionText;

      optionDiv.appendChild(letterDiv);
      optionDiv.appendChild(textSpan);

      optionDiv.addEventListener('click', () => handleOptionClick(idx, optionDiv));
      optionsContainer.appendChild(optionDiv);
    });

    updateStats();
  }

  function handleOptionClick(idx, optionElement) {
    if (answered) return; // redan svarat

    // Ta bort tidigare markerad (om någon)
    document.querySelectorAll('.option').forEach(opt => {
      opt.classList.remove('selected');
    });

    optionElement.classList.add('selected');
    selectedOptionIndex = idx;
    nextBtn.disabled = false;
  }

  function handleNext() {
    if (answered) return;

    if (selectedOptionIndex === null) {
      return; // borde inte kunna hända pga disabled knapp
    }

    const q = questions[currentIndex];
    const isCorrect = (selectedOptionIndex === q.correct);
    answered = true;

    // Markera alla alternativ som disabled (förhindra fler klick)
    const allOptions = document.querySelectorAll('.option');
    allOptions.forEach((opt, idx) => {
      opt.classList.add('disabled');
      opt.classList.remove('selected'); // ta bort selected-markering

      if (idx === q.correct) {
        opt.classList.add('correct');
      } else if (idx === selectedOptionIndex && !isCorrect) {
        opt.classList.add('wrong');
      }
    });

    // Uppdatera poäng
    if (isCorrect) {
      score++;
      scoreDisplay.textContent = score;
    }

    // Visa feedback
    const explanation = q.explanation || (isCorrect ? 'Rätt svar!' : 'Tyvärr, fel svar.');
    const icon = isCorrect ? '✅' : '❌';
    feedbackMessage.innerHTML = `${icon} ${explanation}`;
    feedbackMessage.classList.remove('hidden');

    // Inaktivera "Nästa" tills användaren klickar (den är redan aktiv för att gå vidare)
    // men vi byter text om sista frågan? Hanteras i next-knappen.
    nextBtn.disabled = false;

    // Om sista frågan, ändra knapptext
    if (currentIndex === totalQuestions - 1) {
      nextBtn.textContent = 'Visa resultat 🏁';
    } else {
      nextBtn.textContent = 'Nästa fråga →';
    }
  }

  function goToNext() {
    if (!answered) return; // säkerhet

    if (currentIndex < totalQuestions - 1) {
      currentIndex++;
      // återställ knapptext
      nextBtn.textContent = 'Nästa fråga →';
      renderQuestion();
    } else {
      // Quiz slut -> visa resultat
      showResult();
    }
  }

  function showResult() {
    quizSection.classList.add('hidden');
    resultSection.classList.remove('hidden');

    finalScore.textContent = `${score} / ${totalQuestions}`;
    const percent = (score / totalQuestions) * 100;

    if (percent === 100) {
      resultMessage.textContent = '🏆 Perfekt! Du är redo för teoriprovet!';
    } else if (percent >= 80) {
      resultMessage.textContent = '🌟 Mycket bra! Lite mer övning så sitter det.';
    } else if (percent >= 60) {
      resultMessage.textContent = '📘 Godkänt nivå, men repetera gärna.';
    } else {
      resultMessage.textContent = '📖 Plugga mer och försök igen – du klarar det!';
    }
  }

  function resetQuiz() {
    currentIndex = 0;
    score = 0;
    answered = false;
    selectedOptionIndex = null;

    // Återställ knappar
    nextBtn.textContent = 'Nästa fråga →';
    nextBtn.disabled = true;
    scoreDisplay.textContent = '0';
    progressFill.style.width = '0%';

    // Se till att quiz sektionen syns, resultat göms
    quizSection.classList.remove('hidden');
    resultSection.classList.add('hidden');

    // Rendera första frågan
    renderQuestion();
  }

  // ---------- EVENT LISTENERS ----------
  nextBtn.addEventListener('click', () => {
    if (!answered) {
      // Om användaren klickar "Nästa" utan att ha bekräftat? Vi gör inget.
      return;
    }
    goToNext();
  });

  // Klick på "Börja om" under quiz
  resetBtn.addEventListener('click', resetQuiz);
  // Klick på "Öva igen" i resultatvyn
  restartFromResult.addEventListener('click', resetQuiz);

  // Initiera quizet
  resetQuiz();

  // Extra: vid klick på ett alternativ, men sedan på "Nästa" så markeras rätt/fel via handleNext.
  // Men vår nuvarande logik: handleOptionClick markerar bara selected, nextBtn aktiveras.
  // När man klickar next -> handleNext körs (via goToNext? Nej, nextBtn anropar goToNext)
  // OBS! goToNext kontrollerar answered. Vi måste anropa handleNext FÖRST via nextBtn.
  // Justera: nextBtn ska anropa en funktion som först hanterar svar och sedan går vidare.

  // Jag ändrar nextBtn-lyssnaren:
  // Ta bort den gamla och lägg till en som gör rätt.
  // Vi gör om från början för att vara säkra.

  // Vi tar bort alla event listeners och sätter nya korrekt.
  // (Enklast: ladda om scriptet mentalt, vi definierar om.)

  // Vi gör en ny funktion 'onNextClick':
  function onNextClick() {
    if (!answered) {
      // Första klicket: utvärdera svaret
      if (selectedOptionIndex === null) return; // bör ej ske
      // Kör handleNext som markerar rätt/fel, uppdaterar poäng, feedback
      // Men handleNext förutsätter att selectedOptionIndex är satt.
      // Nu kör vi en omarbetad version: 
      // Vi använder handleNext men den sätter answered = true och disabled etc.
      // Sedan aktiverar vi nextBtn igen för att gå vidare.
      // Men handleNext sätter nextBtn.disabled = false, det är ok.
      // Efter handleNext vill vi att nästa klick på nextBtn ska gå vidare.
      // Så vi kör handleNext och avslutar.
      handleNext();
      // Efter att ha svarat, ändra next-knappens beteende? Nej, den är nu redo för "gå vidare"
      // men vi måste se till att answered är true, så nästa klick går till goToNext.
      return;
    } else {
      // Redan svarat -> gå vidare
      goToNext();
    }
  }

  // Ersätt event listener
  nextBtn.removeEventListener('click', () => {});
  // Ta bort alla gamla listeners genom att klona? Enklare: sätt ny.
  // Vi tar bort alla genom att använda en ny metod:
  const newNextBtn = nextBtn.cloneNode(true);
  nextBtn.parentNode.replaceChild(newNextBtn, nextBtn);
  // Uppdatera referens
  const updatedNextBtn = document.getElementById('nextBtn');
  updatedNextBtn.addEventListener('click', onNextClick);

  // Uppdatera även reset-knappar (inga problem)
  // Se till att resetBtn fungerar
  const newResetBtn = document.getElementById('resetBtn');
  newResetBtn.addEventListener('click', resetQuiz);

  const newRestartFromResult = document.getElementById('restartFromResult');
  newRestartFromResult.addEventListener('click', resetQuiz);

  // Justera referenser i övriga funktioner (nextBtn används i render etc)
  // Vi måste uppdatera globala variabler.
  // Enklast: ladda om hela sidan? Nej, vi gör en omskrivning av referenser.
  // Jag uppdaterar de globala variablerna:
  window.nextBtn = updatedNextBtn;  // ej nödvändigt, men för säkerhet
  // Men funktionerna använder nextBtn som referens. Vi kan inte enkelt byta utan att skriva om.
  // Lösning: Vi gör en fuling: efter kloning sätter vi nextBtn variabeln till det nya elementet.
  // Eftersom scriptet körs i global scope kan vi göra:
